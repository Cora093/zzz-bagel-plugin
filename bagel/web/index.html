    if (!modalOpen()) saveDraft();
    return;
  }
  if (e.key === 'Escape') {
    if (modalOpen()) { closeModal(); return; }
    cancelInsert();
    hidePointMenu();
    return;
  }
  // 输入框和下拉框里的按键留给它们自己（比如在坐标框里撤销输入）。
  if (modalOpen() || isTypingTarget(e.target)) return;
  const key = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && (key === 'y' || (key === 'z' && e.shiftKey))) {
    e.preventDefault();
    redoEdit();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && key === 'z') {
    e.preventDefault();
    undoEdit();
    return;
  }
  if (!canEdit() || state.selectedPoint < 0 || e.ctrlKey || e.metaKey || e.altKey) return;
  const step = e.shiftKey ? 5 : 1;
  const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (moves[e.key]) {
    e.preventDefault();
    hidePointMenu();
    nudgePoint(moves[e.key][0], moves[e.key][1]);
    return;
  }
  if (e.key === 'Delete' && state.selectedPoint > 0) {
    e.preventDefault();
    hidePointMenu();
    deletePoint(state.selectedPoint);
  }
});

wrap.addEventListener('mouseleave', () => {
  state.hoverMap = null;
  renderHud();
  if (state.insertAfter >= 0) {
    state.mouseMap = null;
    draw();
  }
});

window.addEventListener('mousemove', (e) => {
  if (!state.dragging) return;
  state.offsetX = e.clientX - state.dragStart[0];
  state.offsetY = e.clientY - state.dragStart[1];
  draw();
});

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const before = [(mx - state.offsetX) / state.scale, (my - state.offsetY) / state.scale];
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  state.scale = Math.min(Math.max(state.scale * factor, 0.05), MAX_SCALE);
  state.autoFit = false;
  state.offsetX = mx - before[0] * state.scale;
  state.offsetY = my - before[1] * state.scale;
  draw();
}, { passive: false });

window.addEventListener('resize', resizeCanvas);
document.getElementById('saveButton').onclick = () => saveDraft();
document.getElementById('undoButton').onclick = () => undoEdit();
document.getElementById('redoButton').onclick = () => redoEdit();

// ---------- 供 Python 侧调用 ----------
window.bagelEditor = {
  // 推送全部出生点与路线；保住当前选择和未保存的草稿。
  setData(data) {
    state.spawns = data.spawns || [];
    state.rooms = data.rooms || [];
    state.roomAnchors = state.rooms.map(r => ({
      spawn_id: ROOM_PREFIX + r.room_id, room_id: r.room_id, name: r.name, layer: r.layer, map_id: r.map_id,
      x: r.x, y: r.y, radius: r.radius, problem: r.problem, isRoom: true,
    }));
    state.routes = data.routes || [];
    const keptDraft = state.draft;
    if (!state.activeSpawnId || !getSpawn(state.activeSpawnId)) {
      const first = state.spawns.find(s => s.map_id === state.activeMap) || state.spawns[0];
      state.activeSpawnId = first ? first.spawn_id : null;
      if (first && !state.activeMap) state.activeMap = first.map_id;
    }
    if (!state.selectedKey || !routeByKey(state.selectedKey)) {
      const route = state.activeSpawnId
        ? (activeRouteOf(state.activeSpawnId) || routesForSpawn(state.activeSpawnId)[0]) : null;
      state.selectedKey = route ? routeKey(route) : null;
      state.selectedPoint = -1;
      resetDraft();
    } else if (keptDraft && keptDraft.key === state.selectedKey) {
      state.draft = keptDraft;
    } else {
      resetDraft();
    }
    renderAll();
  },
  onResult(requestId, ok, message, data) {
    const resolve = pendingRequests[requestId];
    delete pendingRequests[requestId];
    if (message) notify(message, !ok);
    if (resolve) resolve({ ok, message, data });
  },
  setBusy(busy) {
    state.trial = !!busy.trial;
    cancelInsert();
    renderAll();
  },
  isDirty() { return hasUnsavedEdits(); },
  // 关闭编辑器前由 Python 调用：有未保存修改时让用户选择。
  requestClose() {
    closeModal();
    guardUnsaved(() => call('close', {}));
    return true;
  },
  openCreate() { openCreateRoute(); },
  openRecord() { openRecordDialog(); },
  openManage() { openManage(); },
  startRecording(name) {
    state.recording = true;
    state.livePoints = [];
    state.insertAfter = -1;
    hidePointMenu();
    notify('开始录制「' + name + '」');
    renderAll();
  },
  stopRecording(select) {
    // 录制态必须连同点与角色位置一起清掉：draw() 只看 livePoints
    // 非空就画，残留下来会在图上留一圈点不掉的「死点」。
    state.recording = false;
    state.livePoints = [];
    state.livePosition = null;
    if (select && routeByKey(routeKey(select))) selectRoute(routeKey(select));
    else renderAll();
  },
  addPoint(point) {
    state.livePoints.push(point);
    const layer = state.byName[point.layer];
    if (layer && state.activeMap !== layer.map_id) { state.activeMap = layer.map_id; renderMapTabs(); }
    renderDetail();
    draw();
  },
  popPoint() {
    state.livePoints.pop();
    renderDetail();
    draw();
  },
  setPosition(layerName, localXY) {
    const layer = layerName ? state.byName[layerName] : null;
    if (!layer || !localXY) { state.livePosition = null; draw(); return; }
    if (state.activeMap !== layer.map_id) { state.activeMap = layer.map_id; renderAll(); }
    state.livePosition = toMapCanvas(localXY[0] + layer.origin[0], localXY[1] + layer.origin[1]);
    draw();
  },
  // 持续定位的一次结果：更新工具栏坐标和地图标记。开关打开后的第一次结果把视野移过去（不改缩放），
  // 之后不再动视野，免得拖不动地图。
  updateLocated(layerName, globalXY) {
    const layer = state.byName[layerName];
    if (!state.tracking || !layer || !globalXY) return;
    const first = !state.located;
    state.located = { layer: layerName, x: Math.round(globalXY[0]), y: Math.round(globalXY[1]) };
    const span = document.getElementById('locatedText');
    // 已有坐标文字时原地改字，不重建工具栏，正在选中的文字不会丢。
    if (span && !first) span.textContent = locatedText();
    else renderMapTabs();
    if (!state.trackCentered) {
      state.trackCentered = true;
      if (layer.map_id !== state.activeMap) {
        notify('角色在' + layer.map_id + '，切到该地图可看到位置标记');
      } else {
        const m = state.maps[state.activeMap];
        const rect = wrap.getBoundingClientRect();
        if (m && rect.width) {
          state.autoFit = false;
          state.offsetX = rect.width / 2 - (state.located.x - m.x0) * state.scale;
          state.offsetY = rect.height / 2 - (state.located.y - m.y0) * state.scale;
        }
      }
    }
    draw();
  },
  // 持续定位结束：开关复原；出错时提示原因。坐标保留最后一次结果，方便复制。
  trackStopped(ok, message) {
    state.tracking = false;
    if (!ok && message) notify(message, true);
    renderMapTabs();
  },
  // 用定位结果替换第 index 个点的坐标：只改草稿，保存后才写入文件。
  setPointPosition(index, layerName, globalXY) {
    if (!canEdit() || !state.draft || index < 0 || index >= state.draft.points.length || !globalXY) return;
    recordHistory();
    const p = state.draft.points[index];
    p.x = Math.round(globalXY[0]);
    p.y = Math.round(globalXY[1]);
    if (layerName && state.byName[layerName]) p.layer = layerName;
    state.selectedPoint = index;
    afterEdit();
    notify('第 ' + (index + 1) + ' 点已定位到 (' + p.x + ', ' + p.y + ')，保存后生效');
  }
};

resizeCanvas();
boot();
</script>
</body>
</html>
